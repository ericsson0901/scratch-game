<head>
  <meta charset="UTF-8">
  <title>參與促銷活動</title>
  <!-- 保持手機畫面固定在 100% 大小 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 廣告遮罩樣式 */
    #adOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #fff;
      text-align: center;
    }
    #adOverlay img {
      max-width: 80%;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    #closeAdBtn {
      padding: 10px 20px;
      font-size: 18px;
      background: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 60px); /* 每排固定 6 格 */
      gap: 5px;
      margin-top: 20px;
      max-height: 80vh;       /* 限制高度 */
      overflow-y: auto;       /* 超出範圍時可上下捲動 */
    }

    .cell {
      width: 60px;
      height: 60px;
      background: #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      border-radius: 5px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    /* 放大到正中間，佔滿螢幕 */
    .cell.enlarged {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      max-height: 80vh; /* 避免超過螢幕高度 */
      background: #fff;
      z-index: 1001; /* 提高層級，蓋在遮罩之上 */
    }
    /* 刮完保持白底 */
    .cell.revealed {
      background: #fff;
    }
    .scratchCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none; /* 阻止 iPhone Safari 將觸控解讀成捲動 */
    }
    .hiddenNumber {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #000;
      pointer-events: none;
      transition: font-size 0.2s ease;
    }
    /* 放大時字體按比例放大 */
    .cell.enlarged .hiddenNumber {
      font-size: 20vw;
    }
    /* 中獎而且已經刮完縮小後才變金色 */
    .cell.win.revealed .hiddenNumber {
      color: gold;
      font-weight: bold;
    }
    /* 遊戲代碼清單樣式 */
    #gameListUl {
      list-style: none;
      padding: 0;
    }
    #gameListUl li {
      margin: 10px 0;
    }
    #gameListUl button {
      padding: 8px 16px;
      font-size: 16px;
      background: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    #gameListUl button:hover {
      background: #45a049;
    }

    body.noscroll {
      overflow: hidden;
      width: 100%;
    }

    /* 透明佔位格子樣式 */
    .cell.placeholder {
      background: transparent !important;
      border: none !important;
      visibility: hidden;
    }

    /* 新增全螢幕透明遮罩，鎖住其他操作 */
    #lockOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0); /* 完全透明 */
      z-index: 1000; /* 在格子下面，但蓋住其他元素 */
      display: none;
    }
  </style>
</head>
<body>
<!-- 廣告遮罩 -->
<div id="adOverlay">
  <img src="ad.png" alt="系統家具設計廣告">
  <button id="closeAdBtn">聯絡我們</button>
</div>
  <!-- 新增透明遮罩 -->
  <div id="lockOverlay"></div>
  <!-- 登入區塊 -->
  <div id="login" style="display:none;">
    <h2>請輸入電話號碼</h2>
    <input type="password" id="password" placeholder="輸入電話號碼">
    <button id="loginBtn">送出</button>
  </div>

  <!-- 選擇遊戲代碼區塊 -->
  <div id="selectGame" style="display:none;">
    <h2>選擇遊戲代碼</h2>
    <button id="refreshGameListBtn">更新清單</button>
    <ul id="gameListUl"></ul>
  </div>

  <!-- 遊戲區塊 -->
  <div id="game" style="display:none;">
    <h2>中獎號碼：<span id="winning"></span></h2>
    <p>已刮出：<span id="scratchedCount">0</span>　剩下：<span id="remainingCount">0</span></p>
    <p>剩下未刮出的中獎號碼：<span id="remainingWinning"></span></p>
    <div class="grid" id="grid"></div>
  </div>

  <script src="game.js"></script>
  <script>
    // === 固定玩家 UID ===
    if (!localStorage.getItem('playerId')) {
      localStorage.setItem('playerId', crypto.randomUUID());
    }
    const playerId = localStorage.getItem('playerId');

    // 全域變數保存中獎號碼
    let winningNumbers = [];

    // 點擊廣告後顯示登入區塊
    document.getElementById('closeAdBtn').addEventListener('click', () => {
      document.getElementById('adOverlay').style.display = 'none';
      document.getElementById('login').style.display = 'block';
    });

    // 登入驗證
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (res.ok) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('selectGame').style.display = 'block';
        loadGameList();
      } else {
        const err = await res.json();
        alert(err.error || '密碼錯誤');
      }
    });

    // 載入遊戲代碼清單
    async function loadGameList() {
      const res = await fetch('/api/game-list');
      if (res.ok) {
        const data = await res.json();
        const ul = document.getElementById('gameListUl');
        ul.innerHTML = '';

        data.codes.forEach(code => {
          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.textContent = code;
          btn.onclick = () => startSelectedGame(code);
          li.appendChild(btn);
          ul.appendChild(li);
        });
      } else {
        alert('無法取得遊戲清單');
      }
    }

    // 開始遊戲
    function startSelectedGame(gameCode) {
      fetch('/api/join-game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: gameCode, playerId })
      }).then(res => {
        if (res.ok) {
          document.getElementById('selectGame').style.display = 'none';
          document.getElementById('game').style.display = 'block';
          if (typeof startGame === 'function') {
            startGame(gameCode);
          }
        } else {
          res.json().then(err => {
            alert(err.error || "無法進入遊戲");
          });
        }
      });
    }
    // 顯示中獎號碼並保存到全域變數
    function showWinningNumbers(numbers) {
      winningNumbers = numbers; // 保存中獎號碼陣列
      document.getElementById('winning').textContent = numbers.join(', ');
      updateRemainingWinningNumbers(); // 初始化顯示剩下未刮出的號碼
    }

    // 更新剩下未刮出的中獎號碼
    function updateRemainingWinningNumbers() {
      const revealedCells = document.querySelectorAll('.cell.revealed.win .hiddenNumber');
      const revealedNumbers = Array.from(revealedCells).map(span => span.textContent);

      const remainingNumbers = winningNumbers.filter(num => !revealedNumbers.includes(num));
      document.getElementById('remainingWinning').textContent = remainingNumbers.join(', ');
    }

    // 刮刮樂效果初始化
    function initScratchCanvas(cell, number) {
      const canvas = document.createElement('canvas');
      canvas.className = 'scratchCanvas';
      canvas.width = cell.offsetWidth;
      canvas.height = cell.offsetHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const span = document.createElement('span');
      span.className = 'hiddenNumber';
      span.textContent = number;

      cell.appendChild(span);
      cell.appendChild(canvas);

      function scratch(e) {
        if (e.cancelable) e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        ctx.globalCompositeOperation = 'destination-out';

        const radius = canvas.width * 0.05;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        // 判斷號碼區域是否已經完全刮開
        const hiddenRect = span.getBoundingClientRect();
        const hiddenPixels = ctx.getImageData(
          hiddenRect.left - rect.left,
          hiddenRect.top - rect.top,
          hiddenRect.width,
          hiddenRect.height
        ).data;

        let transparent = 0;
        for (let i = 3; i < hiddenPixels.length; i += 4) {
          if (hiddenPixels[i] === 0) transparent++;
        }
        const ratio = transparent / (hiddenPixels.length / 4);

        if (ratio > 0.9 && !cell.dataset.revealed) {
          cell.dataset.revealed = "true";

          setTimeout(() => {
            cell.classList.remove('enlarged');
            cell.classList.add('revealed');
            if (cell.dataset.win === "true" && !cell.dataset.alerted) {
              alert('🎉 恭喜中獎！你刮到了號碼 ' + number);
              cell.dataset.alerted = "true";
              cell.classList.add('win');
            }
            enablePageScroll();
            document.getElementById('lockOverlay').style.display = 'none';

            canvas.remove();
            updateRemainingWinningNumbers();
          }, 1500);
        }
      }

      canvas.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
      canvas.addEventListener('touchmove', scratch, { passive: false });
      canvas.addEventListener('mousemove', scratch);
    }

    function createScratchCell(cell, number, isWin, alreadyRevealed) {
      if (!alreadyRevealed) {
        const confirmChoice = confirm("是否選擇這個格子進行刮刮樂？");
        if (!confirmChoice) {
          return;
        }

        const placeholder = document.createElement('div');
        placeholder.className = 'cell placeholder';
        cell.parentNode.insertBefore(placeholder, cell);

        cell.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        setTimeout(() => {
          cell.classList.add('enlarged');
          disablePageScroll();
          document.getElementById('lockOverlay').style.display = 'block';
        }, 300);

        cell.addEventListener('transitionend', () => {
          if (!cell.classList.contains('enlarged') && placeholder.parentNode) {
            placeholder.remove();
          }
        });

        initScratchCanvas(cell, number);
        if (isWin) cell.dataset.win = "true";
      } else {
        const span = document.createElement('span');
        span.className = 'hiddenNumber';
        span.textContent = number;
        cell.appendChild(span);

        cell.classList.add('revealed');
        cell.dataset.revealed = "true";
        if (isWin) {
          cell.classList.add('win');
          cell.dataset.win = "true";
        }
      }
    }

    // 遮罩阻止點擊
    const lockOverlay = document.getElementById('lockOverlay');
    lockOverlay.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
    }, true);
    lockOverlay.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
    }, true);
  </script>
</body>
</html>
